# Publicación en Render (https://render.com) — "New > Blueprint" y seleccione este repositorio.
services:
  - type: web
    name: legaltax
    runtime: node
    plan: starter            # necesario para el disco persistente de archivos
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: node src/seed.js && node src/server.js
    healthCheckPath: /api/me
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: legaltax-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL     # cuenta de Administración que se crea al primer arranque
        value: legaltax.consultores@gmail.com
      - key: ADMIN_PASSWORD  # contraseña inicial de Administración (mínimo 8 caracteres)
        sync: false
      - key: PUBLIC_URL      # p. ej. https://legaltax.onrender.com/ o su dominio
        sync: false
    disk:
      name: archivos
      mountPath: /var/data
      sizeGB: 5

databases:
  - name: legaltax-db
    plan: basic-256mb
    databaseName: legaltax
    user: legaltax
