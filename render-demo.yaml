# DEMOSTRACIÓN GRATUITA en Render — para probar la interfaz sin pagar.
# En Render: New > Blueprint > legaltaxconsultores/legaltax > Blueprint Path: render-demo.yaml
# Limitaciones del plan gratis: la app "se duerme" tras 15 min sin uso (tarda ~1 min en despertar),
# los archivos subidos se borran al reiniciarse y la base de datos gratuita vence a los 30 días.
# Usa datos ficticios y la contraseña de demostración; no cargue información real de clientes aquí.
services:
  - type: web
    name: legaltax-demo
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: node src/seed.js && node src/server.js
    healthCheckPath: /api/me
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: legaltax-demo-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        value: LegalTax2026!

databases:
  - name: legaltax-demo-db
    plan: free
    databaseName: legaltax
    user: legaltax
